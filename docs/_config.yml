title: python-vibe
description: A local command-line tool for one Python folder. Ask a question, write a test, fix a bug, or add a small function.
url: https://yauhenbichel.github.io
baseurl: /python-vibe
lang: en
author:
  name: Yauhen Bichel
  url: https://github.com/YauhenBichel
markdown_raw: https://raw.githubusercontent.com/YauhenBichel/python-vibe/HEAD/docs
permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
exclude:
  - Gemfile
  - Gemfile.lock

defaults:
  - scope:
      path: ""
    values:
      layout: default
