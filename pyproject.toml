[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-vibe"
version = "0.3.0"
description = "A deterministic harness around a small local coding model."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Yauhen Bichel" }]
keywords = ["llm", "coding-agent", "ollama", "local"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
]

# The harness itself uses only the standard library. That is deliberate: it
# installs and runs the same way on macOS, Linux and Windows with nothing to
# build. Training and Hub upload need extras. IDE plugins spawn this
# package; they do not add mcp / pygls here. See docs/ide-plugins.md.
dependencies = []

[project.optional-dependencies]
hub = ["huggingface_hub>=1.29.0"]
train = ["mlx-lm[train]>=0.26.0", "pyyaml>=6.0", "huggingface_hub>=1.29.0"]

[project.scripts]
python-vibe = "harness.cli:main"

[project.urls]
Homepage = "https://github.com/YauhenBichel/python-vibe"
Documentation = "https://yauhenbichel.github.io/python-vibe/"
Source = "https://github.com/YauhenBichel/python-vibe"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# `kit_skills/` is a build-time copy of the top-level `skills/` directory so
# an installed package still finds the kit. A source checkout reads
# `skills/` directly. See harness/paths.py.
harness = ["py.typed", "kit_skills/*/SKILL.md"]
