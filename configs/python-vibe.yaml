# QLoRA on Qwen2.5-Coder-0.5B (~400 MB 4-bit). Cloud-sized.
# Adapters are frozen at step 100. Do not add pairs to chase the 18 eval tasks.
model: mlx-community/Qwen2.5-Coder-0.5B-Instruct-4bit
train: true
fine_tune_type: lora
optimizer: adamw
data: data/python-vibe
seed: 7
num_layers: 12
batch_size: 4
iters: 120
val_batches: 10
learning_rate: 2.0e-5
steps_per_report: 10
steps_per_eval: 40
grad_accumulation_steps: 2
adapter_path: adapters/python-vibe
save_every: 40
test: false
max_seq_length: 1536
grad_checkpoint: true
mask_prompt: true
lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.v_proj"]
  rank: 8
  scale: 20.0
  dropout: 0.0
