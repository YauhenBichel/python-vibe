name: Bug report
description: Something in training, the harness, or serve.py does not work
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste real API keys.**
        If this is a security vulnerability, open a public issue and add the
        `security` label. Do not paste live keys.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. PYTHONPATH=src python -m unittest discover -s tests -q
        2. PYTHONPATH=src python scripts/run/chat.py "jsonl reader"
        3. See error
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      options:
        - Harness / PythonVibeGuard
        - serve.py / chat.py
        - Training / data build
        - Hugging Face export
        - Docs
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.13.2"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact any keys, hostnames, or user identifiers.
      render: shell
