name: Contributors

# Fills the README markers from the GitHub contributors API
# (commit order, bots omitted). Do not hardcode names or counts.
#
# Does not open a pull request. Protected main refuses both a
# GITHUB_TOKEN push and "Actions may create PRs" (that setting is
# off). Same-repo PR / feature branches get the commit in place.
# A fork PR cannot be written (and the contributor is not in the
# API until merge). After that merge, or any other default-branch
# run with a stale list, the commit is force-pushed to
# docs/contributors so the change is not discarded.

on:
  pull_request:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: contributors-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          persist-credentials: true

      - name: Fill README contributors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/fill_contributors.py

      - name: Push the list on a writable branch
        if: >-
          github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git diff --cached --quiet && exit 0
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            git checkout -B docs/contributors
            git commit -m "docs: refresh README contributors"
            git push --force --set-upstream origin docs/contributors
          else
            git commit -m "docs: refresh README contributors"
            git push
          fi
